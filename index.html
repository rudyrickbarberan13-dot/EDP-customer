<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Store Checkout System</title>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Mini Store Checkout System</h1>
            <p>Simple, fast, and reliable checkout</p>
        </div>

        <div class="content">
            <div class="section">
                <h2>Customer Information</h2>
                <div class="form-group">
                    <label for="customerName">Customer Name</label>
                    <input type="text" id="customerName" placeholder="Enter customer name">
                </div>
                <div class="form-group">
                    <label for="productCount">Number of Products</label>
                    <input type="number" id="productCount" placeholder="Enter number of products" min="1">
                </div>
            </div>

            <div class="section">
                <h2>Products</h2>
                <div id="productsContainer" class="products-container"></div>
            </div>

            <div class="section">
                <h2>Delivery</h2>
                <div class="form-group">
                    <label for="deliveryOption">Delivery Option</label>
                    <select id="deliveryOption">
                        <option value="1">Store Pickup — ₱0.00</option>
                        <option value="2">Standard Delivery — ₱80.00</option>
                        <option value="3">Express Delivery — ₱150.00</option>
                    </select>
                </div>
            </div>

            <button id="calculateBtn" class="btn">Calculate Order</button>

            <div id="validationMessage"></div>

            <div id="orderSummary"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
